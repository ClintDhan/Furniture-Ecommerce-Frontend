<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <!-- font style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- bt icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- style -->
    <link rel="stylesheet" href="asset/style/style.css">
</head>
<body>

    <header>
        <a href="">CLNTY</a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>

        <i class="bi bi-cart3 cart"></i>
        <div class="view-cart-container">
        </div>
        <i class="bi bi-list menu"></i>
        <div class="cart-count-container"><p class="cart-count"></p></div>
    </header>

    <div class="page-title-container">
        <p>SHOP</p>
    </div>

    <!-- menu modal -->
    <div class="modal-container">
        <div class="modal">
            <div class="modal-title-container">
                <p>CLNTY</p>
            </div>

            <div class="modal-link-container">
                <a class="modal-links" href="index.html">HOME</a> <br>
                <a class="modal-links" href="shop.html">SHOP</a> <br>
                <a class="modal-links" href="about.html">ABOUT</a> <br>
                <a class="modal-links" href="contact.html">CONTACT</a> <br>
            </div>
        </div>
        <div class="modal-exit">
            <i class="bi bi-x-lg exit-icon"></i>
        </div>

        <a href="cart.html" class="modal-cart">
            <i class="bi bi-cart3 mobile-cart"></i>
        </a>

        <a href="cart.html" class="mobile-cart-count-container"><span class="mobile-cart-count"></span></a>

    </div>


    <div class="cart-modal-container">
        <div class="cart-modal">
            <div class="cart-product-modal-info">
                
            </div>

            <div class="cart-modal-btn-container">
                <button class="cart-modal-cancel-btn">CANCEL</button>
                <button class="cart-modal-add-btn">ADD</button>
            </div>
        </div>
    </div>

    

    <div class="shop-products-flex">
        <div class="filter-container">
            <p class="filter-title">Filter Option</p>
            <div class="filter-category-container">
                <p class="category-title">Category</p>
                <div class="filter-option-container">
                    <input name="category" type="radio" value="all" checked>
                    <label for="">All</label>
                </div>
                <div class="filter-option-container">
                    <input name="category" type="radio" value="bedroom">
                    <label for="">Bedroom</label>
                </div>
                <div class="filter-option-container">
                    <input name="category" type="radio" value="restroom">
                    <label for="">Restrooom</label>
                </div>
                <div class="filter-option-container">
                    <input name="category" type="radio" value="kitchen">
                    <label for="">Kitchen</label>
                </div>
                <div class="filter-option-container">
                    <input name="category" type="radio" value="outdoor">
                    <label for="">Outdoor</label>
                </div>
            </div>
        </div>

        <div class="products-section">
            <div class="shop-products-container"></div>
            <center class="shop-products-center"><button class="load-more-btn">LOAD MORE</button></center>
        </div>

    </div>
    
    <div class="toast-notification">
        <div class="toast-check-container">
            <i class="bi bi-check toast-check"></i>
        </div>

        <span class="toast-message">Added to cart succesfully!</span>

        <i class="bi bi-x toast-exit-btn"></i>
    </div>

    <footer>
        <div class="footer-flx">
            <p>©2025 CLINT DHANIELLE S. ROÑO</p>
        <div class="footer-icon-flex">
            <a target="_blank" href="https://www.facebook.com/clint.rono.9/"><i class="bi bi-facebook"></i></a>
            <a target="_blank" href="https://www.instagram.com/dhanielleron/"><i class="bi bi-instagram"></i></a>
            <a target="_blank" href="https://github.com/ClintDhan"><i class="bi bi-github"></i></a>
        </div>
        </div>

    
    </footer>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
<script type="module" src="js/showProduct.js"></script>
<script type="module" src="js/productsCart.js"></script>
<script type="module" src="js/cartCount.js"></script>
<script type="module" src="js/viewCart.js"></script>

</body>
</html>
