<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <!-- font style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- bt icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- style -->
    <link rel="stylesheet" href="asset/style/style.css">
</head>
<body>

    <header>
        <a href="">CLNTY</a>

        <nav>
            <a href="">HOME</a>
            <a href="">SHOP</a>
            <a href="">ABOUT</a>
            <a href="">CONTACT</a>
        </nav>

        <i class="bi bi-cart3"></i>
    </header>

    <div class="page-title-container">
        <p>SHOP</p>
    </div>

    <div class="shop-products-flex">
        <div class="filter-container">
            <p>Filter Option</p>
            <div>
                <p>Category</p>
                <div class="filter-option-container">
                    <input type="radio">
                    <label for="">All</label>
                </div>
                <div class="filter-option-container">
                    <input type="radio">
                    <label for="">Bedroom</label>
                </div>
                <div class="filter-option-container">
                    <input type="radio">
                    <label for="">Restrooom</label>
                </div>
                <div class="filter-option-container">
                    <input type="radio">
                    <label for="">Kitchen</label>
                </div>
                <div class="filter-option-container">
                    <input type="radio">
                    <label for="">Outdoor</label>
                </div>
            </div>
        </div>

        <div class="shop-products-container">
            <div class="shop-products-card">
                <div>
                    <img src="" alt="">
                </div>
                
                <div class="shop-card-flx">
                    <div>
                        <p class="shop-product-title"></p>
                        <p class="shop-product-price"></p>
                    </div>

                    <div class="product-add-cart-container">
                        <i class="bi bi-cart-plus"></i>
                    </div>
                </div>
            </div>
            <button class="shop-more-btn">LOAD MORE</button>
        </div> 
    </div>

    <footer>
        <p>©2025 CLINT DHANIELLE S. ROÑO</p>
        <div class="footer-icon-flex">
            <i class="bi bi-facebook"></i>
            <i class="bi bi-instagram"></i>
            <i class="bi bi-github"></i>
        </div>
    </footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
    
</body>
</html>
