<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart</title>

    <!-- font style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- bt icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- style -->
    <link rel="stylesheet" href="asset/style/style.css">
</head>
<body>

     <header>
        <a href="">CLNTY</a>

        <nav>
            <a href="">HOME</a>
            <a href="">SHOP</a>
            <a href="">ABOUT</a>
            <a href="">CONTACT</a>
        </nav>

        <i class="bi bi-cart3"></i>
    </header>

    <div class="page-title-container">
        <p>CART</p>
    </div>

    <div class="cart-header">
        <div>
            <p>Product</p>
        </div>

        <div>
            <p>Unit Price</p>
            <p>Quantity</p>
            <p>Total Price</p>
            <p>Action</p>
        </div>
    </div>

    <div class="cart-product-container">
        <div class="cart-product-info">
            <div class="cart-product-info-left">
                <input type="checkbox">
                <img src="" alt="">
                <p></p>
            </div>

            <div class="cart-product-info-right">
                <p class="cart-product-price"></p>
                <p class="cart-product-quantity"></p>
                <p class="cart-product-total"></p>
                <p class="cart-product-delete">DELETE</p>
            </div>
        </div>
    </div>

    <div class="cart-checkout-flx">
        <div class="cart-checkout-container">
            <p>Total (0 items): ₱0</p>
            <button class="checkout-btn">CHECKOUT</button>
        </div>
    </div>

    <footer>
        <p>©2025 CLINT DHANIELLE S. ROÑO</p>
        <div class="footer-icon-flex">
            <i class="bi bi-facebook"></i>
            <i class="bi bi-instagram"></i>
            <i class="bi bi-github"></i>
        </div>
    </footer>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
