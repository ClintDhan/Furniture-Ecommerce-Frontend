<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>

    <!-- font style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap" rel="stylesheet">

    <!-- bt icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- style -->
    <link rel="stylesheet" href="asset/style/style.css">
</head>
<body>

    <header>
        <a href="">CLNTY</a>

        <nav>
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="about.html">ABOUT</a>
            <a href="contact.html">CONTACT</a>
        </nav>

        <i class="bi bi-cart3 cart"></i>
        <div class="view-cart-container">
        </div>
        <i class="bi bi-list menu"></i>
        <div class="cart-count-container"><p class="cart-count"></p></div>
    </header>

    <div class="page-title-container">
        <p>CONTACT</p>
    </div>

    <div class="modal-container">
        <div class="modal">
            <div class="modal-title-container">
                <p>CLNTY</p>
            </div>

            <div class="modal-link-container">
                <a class="modal-links" href="index.html">HOME</a> <br>
                <a class="modal-links" href="shop.html">SHOP</a> <br>
                <a class="modal-links" href="about.html">ABOUT</a> <br>
                <a class="modal-links" href="contact.html">CONTACT</a> <br>
            </div>
        </div>
        <div class="modal-exit">
            <i class="bi bi-x-lg exit-icon"></i>
        </div>

        <a href="cart.html" class="modal-cart">
            <i class="bi bi-cart3 mobile-cart"></i>
        </a>

        <a href="cart.html" class="mobile-cart-count-container"><span class="mobile-cart-count"></span></a>

    </div>
    <div class="contact-form-flx">
        <div class="contact-form-container">
            <p class="contact-form-title">GET IN TOUCH WITH US</p>
            <div class="form-container">
                <form action="" class="contact-form">
                    <div class="input-container">
                        <label for="">Full Name</label>
                        <input type="text" required>
                    </div>

                    <div class="input-container">
                        <label for="">Email</label>
                        <input type="email" required>
                    </div>

                    <div class="input-container">
                        <label for="">Message</label> <br>
                        <textarea name="" id="" required></textarea>
                    </div>

                    <button class="contact-form-btn">SUBMIT</button>
                </form>
                
            </div>
        </div>
    </div>


    <div class="contact-information-section">
        <div class="contact-information-container">
            <div class="contact-information-card">
                <div class="contact-information-card-container exclamation">
                    <i class="bi bi-exclamation"></i>
                    <p class="visit">VISIT US</p>
                </div>

                <p>123 Furniture Street ,Davao City, Philippines</p>
            </div>
            <div class="contact-information-card">
                <div class="contact-information-card-container">
                    <i class="bi bi-telephone-fill"></i>
                    <p class="call">CALL US</p>
                </div>

                <p>+63 912 345 6789 Mon–Sat, 9:00 AM–6:00 PM</p>
            </div>
            <div class="contact-information-card">
                <div class="contact-information-card-container">
                    <i class="bi bi-envelope-check"></i>
                    <p class="email">EMAIL US</p>
                </div>

                <p>hello@yourfurniture.com</p>
            </div>
        </div>

    </div>


    <footer>
        <div class="footer-flx">
            <p>©2025 CLINT DHANIELLE S. ROÑO</p>
        <div class="footer-icon-flex">
            <a target="_blank" href="https://www.facebook.com/clint.rono.9/"><i class="bi bi-facebook"></i></a>
            <a target="_blank" href="https://www.instagram.com/dhanielleron/"><i class="bi bi-instagram"></i></a>
            <a target="_blank" href="https://github.com/ClintDhan"><i class="bi bi-github"></i></a>
        </div>
        </div>
    </footer>

</body>
</html>
